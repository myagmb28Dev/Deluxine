services:
  - type: web
    name: deluxine-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3000"
      - key: ENABLE_QUEUE_PROCESSORS
        value: "true"

      - key: CORS_ORIGIN
        sync: false

      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"

      - key: REDIS_URL
        sync: false
      - key: REDIS_TLS
        value: "true"

      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON_B64
        sync: false

      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_KEY_PREFIX
        value: "uploads"
      - key: R2_SIGNED_GET_TTL_SEC
        value: "600"
      - key: R2_SIGNED_PUT_TTL_SEC
        value: "60"

      - key: NANO_BANANA_BASE_URL
        sync: false
      - key: NANO_BANANA_MODEL
        sync: false
      - key: NANO_BANANA_API_KEY
        sync: false
